<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D2137"/>
      <stop offset="100%" stop-color="#0B7A75"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9922C"/>
      <stop offset="100%" stop-color="#F0C060"/>
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>

  <!-- Stylised "F" for FinSmart -->
  <rect x="16" y="16" width="5" height="32" rx="2.5" fill="white" opacity="0.95"/>
  <rect x="16" y="16" width="22" height="5" rx="2.5" fill="white" opacity="0.95"/>
  <rect x="16" y="29" width="17" height="5" rx="2.5" fill="white" opacity="0.95"/>

  <!-- Gold spark / upward arrow – signals financial growth -->
  <path d="M38 42 L46 26 L50 34" stroke="url(#spark)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="46" cy="24" r="3" fill="url(#spark)"/>
</svg>
